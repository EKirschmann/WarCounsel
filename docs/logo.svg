<svg xmlns="http://www.w3.org/2000/svg" width="760" height="180" viewBox="0 0 760 180" role="img" aria-label="WarCounsel">
  <title>WarCounsel — combat meter and advisor for EverQuest Legends</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2030"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d9a0"/>
      <stop offset="0.55" stop-color="#d8ab5c"/>
      <stop offset="1" stop-color="#a9702f"/>
    </linearGradient>
    <linearGradient id="scroll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d9a0"/>
      <stop offset="0.55" stop-color="#d8ab5c"/>
      <stop offset="1" stop-color="#a9702f"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b47c37"/>
      <stop offset="0.5" stop-color="#f0d29a"/>
      <stop offset="1" stop-color="#a9702f"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4e3b8"/>
      <stop offset="0.45" stop-color="#d9b46b"/>
      <stop offset="1" stop-color="#9d7534"/>
    </linearGradient>
  </defs>

  <rect x="1.5" y="1.5" width="757" height="177" fill="url(#bg)"
