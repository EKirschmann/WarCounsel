  <!-- mark: the icon art, scaled into the left third -->
  <g transform="translate(44,22) scale(0.53)">
    <rect x="52" y="96" width="152" height="104" fill="url(#scroll)"/>
    <path d="M52 96 a16 16 0 0 0 0 32 l0 72 a16 16 0 0 1 0 -32 Z" fill="url(#roll)"/>
    <path d="M204 96 a16 16 0 0 1 0 32 l0 72 a16 16 0 0 0 0 -32 Z" fill="url(#roll)"/>
    <rect x="52" y="96" width="152" height="3" fill="#f7e6bd" opacity="0.55"/>
    <g stroke="#8a5a22" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.75">
      <path d="M72 116 l10 0 M77 116 l0 14"/>
      <path d="M72 142 l10 -8 M72 142 l10 8"/>
      <path d="M72 168 l0 14 M72 168 l10 7 l-10 7"/>
      <path d="M174 116 l10 0 M179 116 l0 14"/>
      <path d="M174 142 l0 14 M174 142 l10 14 M184 142 l0 14"/>
      <path d="M174 168 l10 14 M184 168 l-10 14"/>
    </g>
    <circle cx="128" cy="34" r="11" fill="url(#steel)"/>
    <rect x="122" y="44" width="12" height="26" rx="2" fill="url(#steel)"/>
    <path d="M92 72 l72 0 l-8 13 l-56 0 Z" fill="url(#steel)"/>
    <path d="M116 85 l24 0 l0 128 l-12 22 l-12 -22 Z" fill="#1b2233"/>
    <path d="M116 85 l24 0 l0 6 l-24 0 Z" fill="url(#steel)"/>
    <path d="M116 200 l24 0 l0 13 l-12 22 l-12 -22 Z" fill="url(#steel)"/>
    <rect x="116" y="85" width="2.5" height="118" fill="#e6cf95" opacity="0.85"/>
    <rect x="137.5" y="85" width="2.5" height="118" fill="#9d7534" opacity="0.9"/>
    <g fill="#e6cf95">
      <rect x="121" y="104" width="14" height="3.5"/>
      <rect x="121" y="122" width="10" height="3.5"/>
      <rect x="121" y="140" width="14" height="3.5"/>
      <rect x="121" y="158" width="8"  height="3.5"/>
      <rect x="121" y="176" width="12" height="3.5"/>
    </g>
  </g>

  <text x="210" y="88" font-family="Georgia, 'Times New Roman', serif"
        font-size="52" letter-spacing="3" font-weight="bold" fill="url(#gold)">WARCOUNSEL</text>
  <rect x="212" y="100" width="500" height="1" fill="rgba(216,171,92,0.34)"/>
  <text x="213" y="122" font-family="Georgia, 'Times New Roman', serif"
        font-size="12.5" letter-spacing="3.1" fill="#8b8577">COMBAT METER AND ADVISOR FOR EVERQUEST LEGENDS</text>
