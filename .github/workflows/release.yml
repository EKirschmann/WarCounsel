name: Build and release the .exe

# Builds the packaged executable on a CLEAN Windows runner and attaches it to
# the release for the tag that triggered it.
#
# Why CI rather than a local build: PyInstaller only bundles what the build
# machine happens to have installed, so a laptop with extra packages produces
# a different exe than requirements-lite.txt describes. That exact drift
# already shipped once (the LLM clients were bundled by accident). A clean
# runner makes the build match the file that documents it -- and it is the
# prerequisite for SignPath, which signs only binaries it can verify came
# from this repository.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # lets you build the exe without cutting a tag
    inputs:
      tag:
        description: "Existing tag to attach the build to (blank = artifact only)"
        required: false

permissions:
  contents: write             # needed to upload the asset to the release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Verify the changelog documents this tag
        # Runs BEFORE the ~10 minute build so a missing section costs seconds,
        # not a whole run. v2.0.1 shipped with "Automated build for v2.0.1."
        # as its entire release notes because nothing checked.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace '^refs/tags/',''
          $ver = $tag -replace '^v',''
          $md  = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($md, "(?ms)^## v$([regex]::Escape($ver))\b[^\r\n]*\r?\n(.*?)(?=^## |\z)")
          if (-not $m.Success -or $m.Groups[1].Value.Trim().Length -lt 60) {
            throw "CHANGELOG.md has no usable '## v$ver' section - the release would ship with placeholder notes"
          }
          "changelog section found: $($m.Groups[1].Value.Trim().Length) chars" | Write-Host

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Python dependencies
        # requirements-lite.txt IS the contract for what the exe can do --
        # install exactly it, nothing more.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lite.txt pyinstaller pywebview

      - name: Build the static UI
        # NEXT_EXPORT=1 emits frontend/out, which the backend serves at /.
        # Skipping this is how a release once shipped a UI eight versions old.
        working-directory: frontend
        env:
          NEXT_EXPORT: "1"
        run: |
          npm ci
          npm run build

      - name: Verify the UI carries this version
        shell: pwsh
        run: |
          $ver = (Select-String -Path frontend/lib/version.ts -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          if (-not (Select-String -Path frontend/out/index.html -Pattern ([regex]::Escape($ver)) -Quiet)) {
            throw "frontend/out does not contain $ver - the export is stale"
          }
          "UI export reports $ver" | Write-Host

      - name: Fetch the eqlbuilds snapshot
        # Exact spell/AA unlock levels. Optional: without it the advisor falls
        # back to the wiki over HTTP, so a fetch failure must not fail a
        # release. The folder itself has to exist either way, because
        # PyInstaller errors on a missing --add-data source.
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force data/eqlbuilds | Out-Null
          $url = "https://raw.githubusercontent.com/ArtSabintsev/everquest-legends-mcp/main/src/data/eqlbuilds/classes.json"
          try {
            Invoke-WebRequest -Uri $url -OutFile data/eqlbuilds/classes.json -TimeoutSec 60
            "snapshot: {0:N1} MB" -f ((Get-Item data/eqlbuilds/classes.json).Length / 1MB) | Write-Host
          } catch {
            Write-Warning "snapshot unavailable - the exe will use the wiki over HTTP"
          }

      - name: Ensure the snapshot folder exists
        shell: pwsh
        run: New-Item -ItemType Directory -Force data/eqlbuilds | Out-Null

      - name: Stamp the version into the exe
        # Filename stays stable (permalink + shortcuts); the version
        # goes where Windows looks for it: Properties -> Details.
        run: python scripts/make_version_file.py

      - name: PyInstaller
        # Kept in step with build_exe.bat -- change both together.
        run: >
          pyinstaller --noconfirm --onefile --windowed --name WarCounsel
          --add-data "frontend/out;frontend/out"
          --add-data "data/eqlbuilds;data/eqlbuilds"
          --add-data "class_guides;class_guides"
          --add-data "backend/spell_lines.json;backend"
          --add-data "backend/zem_levels.wiki;backend"
          --add-data "maps;maps"
          --version-file build/version_info.txt
          --icon docs/warcounsel.ico
          --collect-submodules backend
          --hidden-import uvicorn.logging --hidden-import uvicorn.protocols
          --hidden-import uvicorn.protocols.http.auto
          --hidden-import uvicorn.protocols.http.h11_impl
          --hidden-import uvicorn.protocols.websockets.auto
          --hidden-import uvicorn.protocols.websockets.websockets_impl
          --hidden-import uvicorn.lifespan.on
          --hidden-import uvicorn.loops.asyncio
          --hidden-import pystray._win32
          --exclude-module numpy --exclude-module matplotlib
          --exclude-module rapidocr --exclude-module rapidocr_onnxruntime
          --exclude-module mss --exclude-module cv2 --exclude-module torch
          --exclude-module langgraph --exclude-module onnxruntime
          run_companion.py

      - name: Smoke test the executable
        # A build that compiles but cannot boot is worse than no build: the
        # window is the only thing a user sees, and it fails silently.
        shell: pwsh
        run: |
          $exe = Resolve-Path dist/WarCounsel.exe
          $work = Join-Path $env:RUNNER_TEMP "smoke"
          New-Item -ItemType Directory -Force $work | Out-Null
          $p = Start-Process -FilePath $exe -WorkingDirectory $work -PassThru
          $ok = $null
          $sw = [Diagnostics.Stopwatch]::StartNew()
          while (-not $ok -and $sw.Elapsed.TotalSeconds -lt 120) {
            Start-Sleep -Milliseconds 500
            try { $ok = Invoke-WebRequest "http://127.0.0.1:8000/api/settings" -UseBasicParsing -TimeoutSec 3 } catch {}
          }
          if (-not $ok) {
            Get-Content (Join-Path $work "data/companion.log") -Tail 40 -ErrorAction SilentlyContinue
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "the exe did not start within 120s"
          }
          $info = $ok.Content | ConvertFrom-Json
          $want = (Select-String -Path frontend/lib/version.ts -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process -Name WarCounsel -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $info.packaged) { throw "not reporting itself as a packaged build" }
          if ($info.version -ne $want) { throw "exe reports $($info.version), expected $want" }
          # Bundled data files fail SOFT at runtime, so a missing one is
          # invisible unless asserted. v1.15.1 shipped with the spell-line
          # table absent and the stacking gate silently disabled.
          if ($info.data.spell_lines.lines -lt 1) {
            throw "spell line table missing from the bundle (stacking gate would no-op)"
          }
          "spell lines aboard: $($info.data.spell_lines.lines)" | Write-Host
          # Same trap: with no snapshot AND no network, _gate_locations sees an
          # empty table and passes the model's zone picks through UNGATED.
          if ($info.data.zem_zones -lt 1) {
            throw "ZEM snapshot missing from the bundle (location gate would be bypassed offline)"
          }
          "ZEM snapshot zones: $($info.data.zem_zones)" | Write-Host
          # A zone can ship geometry but no chart; the bundled map is the
          # only thing that fills that gap, and it fails soft if absent.
          if ($info.data.bundled_maps -lt 1) {
            throw "bundled maps missing (New Sebilis Expedition would draw no 2D chart)"
          }
          "bundled maps: $($info.data.bundled_maps)" | Write-Host
          # requirements-lite carries the LLM clients on purpose. Leaving
          # one out once shipped an exe whose API key field could never do
          # anything, and it was invisible because the advisor falls back
          # to the deterministic path without complaining.
          foreach ($p in "openai", "anthropic", "local") {
            if (-not $info.llm.available.$p) {
              throw "LLM provider '$p' missing from the bundle"
            }
          }
          "LLM providers aboard: openai, anthropic, local (Ollama)" | Write-Host

      - name: Verify the overlay's own dependencies survived packaging
        # The overlay is a separate process the server test never reaches, and
        # its tray fails soft -- so a missing hidden import would ship silently.
        shell: pwsh
        run: |
          # Start-Process -Wait, not '&': the exe is a WINDOWED (GUI subsystem)
          # binary, so PowerShell does not block on it and $LASTEXITCODE comes
          # back empty rather than a status.
          $p = Start-Process -FilePath (Resolve-Path dist/WarCounsel.exe) `
                 -ArgumentList '--overlay-check' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "overlay self-check failed (exit $($p.ExitCode))" }
          "overlay imports + tray backend OK" | Write-Host
          # (a summary line used to live here referencing $sw/$info from the
          # smoke-test step -- each step is its own process, so it only ever
          # printed "started in 0s, reports , packaged=". Removed.)

      - name: Record the hash
        # Publish it so anyone can check their download, and so an antivirus
        # false-positive report has something concrete to reference.
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/WarCounsel.exe -Algorithm SHA256).Hash.ToLower()
          "$h  WarCounsel.exe" | Out-File -Encoding ascii dist/WarCounsel.exe.sha256
          "SHA256: $h" | Write-Host
          "### WarCounsel.exe`n``$h``" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        with:
          name: WarCounsel
          path: |
            dist/WarCounsel.exe
            dist/WarCounsel.exe.sha256

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace '^refs/tags/','' } else { '${{ inputs.tag }}' }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            # Body comes from CHANGELOG.md, not a placeholder. The section is
            # already known to exist -- the checkout step refuses the build
            # without it -- so this only has to re-extract it.
            $ver = $tag -replace '^v',''
            $md  = Get-Content CHANGELOG.md -Raw
            $m = [regex]::Match($md, "(?ms)^## v$([regex]::Escape($ver))\b[^\r\n]*\r?\n(.*?)(?=^## |\z)")
            $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Automated build for $tag." }
            Set-Content -Path release-notes.md -Value $notes -Encoding utf8
            gh release create $tag --title $tag --notes-file release-notes.md
          }
          gh release upload $tag dist/WarCounsel.exe dist/WarCounsel.exe.sha256 --clobber
          "attached to $tag" | Write-Host

  # ---------------------------------------------------------------------
  # The OCR build. A SEPARATE job with no `needs:`, deliberately: it is the
  # optional download, and a failure here must never hold back the standard
  # exe that most people actually use.
  #
  # Two things differ from the job above and both are load-bearing:
  #   * requirements-heavy.txt (the OCR stack -- see that file for the
  #     204 MB breakdown and why it is not the default), and
  #   * --onedir instead of --onefile. A one-file bundle re-extracts itself
  #     to temp on EVERY launch; at this payload that is a tax on every
  #     start, so the OCR build is extracted once and zipped for delivery.
  # ---------------------------------------------------------------------
  build-ocr:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Python dependencies (heavy set)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-heavy.txt pyinstaller pywebview

      - name: Build the static UI
        working-directory: frontend
        env:
          NEXT_EXPORT: "1"
        run: |
          npm ci
          npm run build

      - name: Fetch the eqlbuilds snapshot
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force data/eqlbuilds | Out-Null
          $url = "https://raw.githubusercontent.com/ArtSabintsev/everquest-legends-mcp/main/src/data/eqlbuilds/classes.json"
          try {
            Invoke-WebRequest -Uri $url -OutFile data/eqlbuilds/classes.json -TimeoutSec 60
          } catch {
            Write-Warning "snapshot unavailable - the exe will use the wiki over HTTP"
          }

      - name: Ensure the snapshot folder exists
        shell: pwsh
        run: New-Item -ItemType Directory -Force data/eqlbuilds | Out-Null

      - name: Stamp the version into the exe
        run: python scripts/make_version_file.py

      - name: PyInstaller (onedir, OCR included)
        # Kept in step with `build_exe.bat heavy` -- change both together.
        run: >
          pyinstaller --noconfirm --onedir --windowed --name WarCounsel
          --add-data "frontend/out;frontend/out"
          --add-data "data/eqlbuilds;data/eqlbuilds"
          --add-data "class_guides;class_guides"
          --add-data "backend/spell_lines.json;backend"
          --add-data "backend/zem_levels.wiki;backend"
          --add-data "maps;maps"
          --version-file build/version_info.txt
          --icon docs/warcounsel.ico
          --collect-submodules backend
          --hidden-import uvicorn.logging --hidden-import uvicorn.protocols
          --hidden-import uvicorn.protocols.http.auto
          --hidden-import uvicorn.protocols.http.h11_impl
          --hidden-import uvicorn.protocols.websockets.auto
          --hidden-import uvicorn.protocols.websockets.websockets_impl
          --hidden-import uvicorn.lifespan.on
          --hidden-import uvicorn.loops.asyncio
          --hidden-import pystray._win32
          --exclude-module matplotlib --exclude-module torch
          --exclude-module langgraph
          run_companion.py

      - name: Drop opencv's video codec DLL
        # 29.4 MB of ffmpeg. OCR reads still screenshots, so nothing can call
        # it -- but deleting the wrong file fails SOFT (the import still
        # succeeds and OCR breaks only when someone enables it), which is
        # why the smoke test below actually exercises the engine.
        shell: pwsh
        run: |
          $before = (Get-ChildItem dist/WarCounsel -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          Get-ChildItem dist/WarCounsel -Recurse -Filter 'opencv_videoio_ffmpeg*.dll' |
            ForEach-Object { "dropping $($_.Name) ({0:N1} MB)" -f ($_.Length/1MB) | Write-Host; Remove-Item $_.FullName -Force }
          $after = (Get-ChildItem dist/WarCounsel -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          "bundle: {0:N1} MB -> {1:N1} MB" -f $before, $after | Write-Host

      - name: Smoke test, and prove OCR actually works
        # The whole point of this variant. Without the deps_ok assertion a
        # broken OCR bundle ships looking exactly like a working one: the
        # import guard is deliberately broad (a half-present rapidocr raises
        # FileNotFoundError, not ImportError) so it fails quietly by design.
        shell: pwsh
        run: |
          $exe = Resolve-Path dist/WarCounsel/WarCounsel.exe
          $work = Join-Path $env:RUNNER_TEMP "smoke-ocr"
          New-Item -ItemType Directory -Force $work | Out-Null
          $p = Start-Process -FilePath $exe -WorkingDirectory $work -PassThru
          $ok = $null
          $sw = [Diagnostics.Stopwatch]::StartNew()
          while (-not $ok -and $sw.Elapsed.TotalSeconds -lt 120) {
            Start-Sleep -Milliseconds 500
            try { $ok = Invoke-WebRequest "http://127.0.0.1:8000/api/settings" -UseBasicParsing -TimeoutSec 3 } catch {}
          }
          if (-not $ok) {
            Get-Content (Join-Path $work "data/companion.log") -Tail 40 -ErrorAction SilentlyContinue
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "the OCR build did not start within 120s"
          }
          $info = $ok.Content | ConvertFrom-Json
          $want = (Select-String -Path frontend/lib/version.ts -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $ocr = $null
          try { $ocr = (Invoke-WebRequest "http://127.0.0.1:8000/api/ocr/status" -UseBasicParsing -TimeoutSec 5).Content | ConvertFrom-Json } catch {}
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process -Name WarCounsel -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($info.version -ne $want) { throw "exe reports $($info.version), expected $want" }
          if (-not $info.packaged) { throw "not reporting itself as a packaged build" }
          if (-not $ocr) { throw "/api/ocr/status did not answer" }
          if (-not $ocr.deps_ok) {
            throw "OCR deps missing from the OCR build: $($ocr.deps_error)"
          }
          "started in $([int]$sw.Elapsed.TotalSeconds)s, reports $($info.version), OCR deps_ok=$($ocr.deps_ok)" | Write-Host

      - name: Zip it
        shell: pwsh
        run: |
          Compress-Archive -Path dist/WarCounsel/* -DestinationPath dist/WarCounsel-OCR.zip -CompressionLevel Optimal
          $h = (Get-FileHash dist/WarCounsel-OCR.zip -Algorithm SHA256).Hash.ToLower()
          "$h  WarCounsel-OCR.zip" | Out-File -Encoding ascii dist/WarCounsel-OCR.zip.sha256
          "{0:N1} MB, SHA256 $h" -f ((Get-Item dist/WarCounsel-OCR.zip).Length/1MB) | Write-Host
          "### WarCounsel-OCR.zip`n``$h``" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        with:
          name: WarCounsel-OCR
          path: |
            dist/WarCounsel-OCR.zip
            dist/WarCounsel-OCR.zip.sha256

      - name: Attach to the release
        # The release is created by the standard job; if this one wins the
        # race, create it here too rather than failing.
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace '^refs/tags/','' } else { '${{ inputs.tag }}' }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            $ver = $tag -replace '^v',''
            $md  = Get-Content CHANGELOG.md -Raw
            $m = [regex]::Match($md, "(?ms)^## v$([regex]::Escape($ver))\b[^\r\n]*\r?\n(.*?)(?=^## |\z)")
            $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Automated build for $tag." }
            Set-Content -Path release-notes.md -Value $notes -Encoding utf8
            gh release create $tag --title $tag --notes-file release-notes.md
          }
          gh release upload $tag dist/WarCounsel-OCR.zip dist/WarCounsel-OCR.zip.sha256 --clobber
          "attached WarCounsel-OCR.zip to $tag" | Write-Host
